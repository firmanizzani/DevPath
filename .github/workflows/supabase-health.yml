name: Supabase database health

on:
  schedule:
    # Daily at 09:17 WIB (UTC+7), away from the busy start of the hour.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-database-health
  cancel-in-progress: false

jobs:
  database-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public learning tables
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo '::error::Set repository secrets SUPABASE_URL and SUPABASE_ANON_KEY first.'
            exit 1
          fi
          if [[ "$SUPABASE_URL" != https://* ]]; then
            echo '::error::SUPABASE_URL must use HTTPS.'
            exit 1
          fi

          for table in scopes bab_modules quiz_questions; do
            curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --retry 2 --retry-delay 5 --retry-max-time 90 \
              --header "apikey: $SUPABASE_ANON_KEY" \
              --output /dev/null \
              "${SUPABASE_URL%/}/rest/v1/${table}?select=id&limit=1"
            echo "Database read OK: $table"
          done
