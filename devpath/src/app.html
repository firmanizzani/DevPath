<!doctype html>
<html lang="id" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta
			name="description"
			content="DevPath — platform pembelajaran IT terbuka dengan 7 alur karir, 49 bab terstruktur, 490 soal kuis interaktif. 100% gratis."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<script>
			try {
				const saved = localStorage.getItem('devpath:theme');
				const theme = saved === 'light' ? 'light' : 'dark';
				document.documentElement.classList.toggle('dark', theme === 'dark');
				document.documentElement.style.colorScheme = theme;
			} catch (e) {
				document.documentElement.classList.add('dark');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-canvas text-ink">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
